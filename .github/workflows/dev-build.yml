name: Dev Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # ubuntu-latest 镜像已预装 Android SDK（含 build-tools 34 / platforms 34），
        # 直接复用即可。不用 android-actions/setup-android：它内部会执行
        # `sdkmanager tools`，而 `tools` 包已从 SDK 仓库移除，必然失败。
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          ls "${ANDROID_SDK_ROOT}/platforms"
          ls "${ANDROID_SDK_ROOT}/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 仓库里没有 gradle-wrapper.jar，交给 action 安装 Gradle 并注入 gradle 命令
          gradle-version: "8.7"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK with build info
        id: apk
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          OUT="TBMSM-dev-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${OUT}"
          echo "name=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TBMSM-dev-${{ github.sha }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
